<svg xmlns="http://www.w3.org/2000/svg" width="545" height="290" viewBox="0 0 545 290" font-family="Menlo, Consolas, monospace">
  <defs>
    <filter id="cardGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="titlebarGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#20262e"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <clipPath id="infoClip">
      <rect x="0" y="0" width="545" height="290" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#infoClip)">
