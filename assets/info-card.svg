<svg xmlns="http://www.w3.org/2000/svg" width="380" height="310" viewBox="0 0 380 310" font-family="Menlo, Consolas, monospace">
  <defs>
    <filter id="cardGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="titlebarGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#20262e"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <clipPath id="infoClip">
      <rect x="0" y="0" width="380" height="310" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#infoClip)">
    <rect x="0" y="0" width="380" height="310" fill="#0d1117"/>
    <rect x="0" y="0" width="380" height="310" fill="none"
          stroke="#8a2be2" stroke-opacity="0.18" stroke-width="1.5" rx="14" filter="url(#cardGlow)"/>

    <rect x="0" y="0" width="380" height="30" fill="url(#titlebarGrad2)"/>
    <circle cx="18" cy="15.0" r="5.5" fill="#ff5f57"/>
